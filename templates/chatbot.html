```html
<style>
    .chatbot-button {
        position: fixed;
        right: 25px;
        bottom: 25px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        border: none;
        background: #1a73e8;
        color: white;
        font-size: 26px;
        cursor: pointer;
        box-shadow: 0 5px 20px rgba(0,0,0,0.25);
        z-index: 9999;
    }

    .chatbot-box {
        display: none;
        position: fixed;
        right: 25px;
        bottom: 95px;
        width: 340px;
        background: white;
        border-radius: 15px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        overflow: hidden;
        z-index: 9999;
    }

    .chatbot-header {
        background: #1a73e8;
        color: white;
        padding: 15px;
        font-weight: bold;
    }

    .chatbot-body {
        padding: 15px;
    }

    .chatbot-response {
        background: #f1f5f9;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 10px;
        font-size: 14px;
    }

    .chatbot-form {
        display: flex;
        gap: 7px;
    }

    .chatbot-form input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 7px;
    }

    .chatbot-form button {
        border: none;
        background: #1a73e8;
        color: white;
        padding: 10px 14px;
        border-radius: 7px;
        cursor: pointer;
    }
</style>

<button class="chatbot-button" onclick="toggleChatbot()">💬</button>

<div class="chatbot-box" id="chatbotBox">

    <div class="chatbot-header">
        🫀 IntelliHeart Assistant
    </div>

    <div class="chatbot-body">

        {% if response %}
        <div class="chatbot-response">
            {{ response }}
        </div>
        {% else %}
        <div class="chatbot-response">
            Hello! 👋 I'm your Heart Disease Assistant.
            Ask me about heart disease, ECG, Machine Learning,
            models or predictions.
        </div>
        {% endif %}

        <form class="chatbot-form"
              action="{{ url_for('chatbot') }}"
              method="POST">

            <input type="text"
                   name="message"
                   placeholder="Ask something..."
                   required>

            <button type="submit">Send</button>

        </form>

    </div>
</div>

<script>
    function toggleChatbot() {

        const box = document.getElementById("chatbotBox");

        if (box.style.display === "block") {
            box.style.display = "none";
        } else {
            box.style.display = "block";
        }
    }
</script>
